[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hvme"
version = "0.1.0"
description = "Verifiable causal graphs, a tool-using causal reasoning LLM and a symbolic causal engine, tied together by an orchestrator and an MCP server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "josh", email = "ai@namuax.com" }]
dependencies = [
  "networkx>=3.3",
  "pydantic>=2.6",
  "numpy",
  "pandas",
  "scipy",
]
keywords = ["causal inference", "causal discovery", "llm", "mcp", "do-calculus"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
bench = ["pgmpy>=1.0"]
hf = ["torch>=2.7", "transformers>=5.2", "accelerate"]
vllm = ["transformers>=5.2"]  # client for OpenAI-compatible servers (vLLM); only the tokenizer is loaded
api = ["anthropic"]
mcp = ["mcp>=1.2,<2"]
causal = ["dowhy", "causal-learn", "econml"]
dev = ["pytest", "nbformat", "jupyter"]

[project.urls]
Homepage = "https://github.com/namuax/hvme"
Repository = "https://github.com/namuax/hvme"
Issues = "https://github.com/namuax/hvme/issues"
Changelog = "https://github.com/namuax/hvme/blob/main/CHANGELOG.md"
Models = "https://huggingface.co/namuax"

[project.scripts]
hvme-mcp = "hvme.mcp.server:main"

[tool.setuptools.packages.find]
include = ["hvme*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
