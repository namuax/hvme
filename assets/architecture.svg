<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.2; rx: 8; }
    .key { fill: #fde8ec; stroke: #e11d48; stroke-width: 1.4; rx: 8; }
    .t { fill: #111827; }
    .s { fill: #4b5563; font-size: 12px; }
    .h { fill: #111827; font-weight: bold; }
    .a { stroke: #e11d48; stroke-width: 1.8; fill: none; marker-end: url(#m); }
    .g { stroke: #9ca3af; stroke-width: 1.4; fill: none; marker-end: url(#mg); stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e11d48"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/></marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>

  <!-- inputs -->
  <rect class="box" x="20" y="40" width="130" height="56"/>
  <text class="h" x="85" y="64" text-anchor="middle">Table (CSV)</text>
  <text class="s" x="85" y="84" text-anchor="middle">observational data</text>
  <rect class="box" x="20" y="130" width="130" height="56"/>
  <text class="h" x="85" y="154" text-anchor="middle">Documents</text>
  <text class="s" x="85" y="174" text-anchor="middle">reports, notes</text>

  <!-- construction -->
  <rect class="box" x="200" y="40" width="200" height="146"/>
  <text class="h" x="300" y="64" text-anchor="middle">Graph construction</text>
  <text class="s" x="300" y="88" text-anchor="middle">PC + background knowledge</text>
  <text class="s" x="300" y="106" text-anchor="middle">LLM pairwise direction</text>
  <text class="s" x="300" y="124" text-anchor="middle">claim extraction from text</text>
  <text class="s" x="300" y="142" text-anchor="middle">cross-document aggregation</text>
  <text class="s" x="300" y="160" text-anchor="middle">merge by direction evidence</text>
  <path class="a" d="M150,68 L198,68"/>
  <path class="a" d="M150,158 L198,158"/>

  <!-- HCG -->
  <rect class="key" x="450" y="78" width="130" height="70"/>
  <text class="h" x="515" y="104" text-anchor="middle">HCG</text>
  <text class="s" x="515" y="124" text-anchor="middle">causal DAG with</text>
  <text class="s" x="515" y="140" text-anchor="middle">evidence per edge</text>
  <path class="a" d="M400,113 L448,113"/>

  <!-- validation -->
  <rect class="box" x="630" y="40" width="150" height="70"/>
  <text class="h" x="705" y="64" text-anchor="middle">Validation</text>
  <text class="s" x="705" y="84" text-anchor="middle">structure · data tests</text>
  <text class="s" x="705" y="100" text-anchor="middle">experiment check</text>
  <path class="a" d="M580,100 L628,80"/>
  <path class="g" d="M705,110 L705,136 L583,136"/>
  <text class="s" x="640" y="154">refute edges</text>

  <!-- engine -->
  <rect class="key" x="630" y="190" width="150" height="90"/>
  <text class="h" x="705" y="214" text-anchor="middle">Causal engine</text>
  <text class="s" x="705" y="234" text-anchor="middle">identify · estimate</text>
  <text class="s" x="705" y="252" text-anchor="middle">refute · counterfactual</text>
  <text class="s" x="705" y="270" text-anchor="middle">discovery</text>
  <path class="a" d="M560,148 L560,235 L628,235"/>

  <!-- answer -->
  <rect class="box" x="820" y="190" width="120" height="90"/>
  <text class="h" x="880" y="214" text-anchor="middle">Answer</text>
  <text class="s" x="880" y="234" text-anchor="middle">estimate + CI</text>
  <text class="s" x="880" y="252" text-anchor="middle">paths, assumptions</text>
  <text class="s" x="880" y="270" text-anchor="middle">checks passed</text>
  <path class="a" d="M780,235 L818,235"/>

  <!-- question path -->
  <rect class="box" x="20" y="320" width="130" height="56"/>
  <text class="h" x="85" y="344" text-anchor="middle">Question</text>
  <text class="s" x="85" y="364" text-anchor="middle">English or Korean</text>
  <rect class="box" x="200" y="320" width="170" height="56"/>
  <text class="h" x="285" y="344" text-anchor="middle">Rung router (4B)</text>
  <text class="s" x="285" y="364" text-anchor="middle">association / do / CF</text>
  <rect class="box" x="420" y="320" width="200" height="56"/>
  <text class="h" x="520" y="344" text-anchor="middle">LM (9B or 4B)</text>
  <text class="s" x="520" y="364" text-anchor="middle">writes engine tool calls</text>
  <path class="a" d="M150,348 L198,348"/>
  <path class="a" d="M370,348 L418,348"/>
  <path class="a" d="M620,348 L705,348 L705,282"/>
  <text class="s" x="712" y="320">tool calls</text>
</svg>
